name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build and verify Marketplace VSIX
        run: npm run release:local

      - name: Build Open VSX VSIX
        run: npm run package:openvsx

      - name: Generate SHA-256 checksums
        run: shasum -a 256 code-office-*.vsix > SHA256SUMS.txt

      - name: Verify release artifact set
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -s SHA256SUMS.txt
          grep "code-office-${VERSION}.vsix" SHA256SUMS.txt
          grep "code-office-${VERSION}-openvsx.vsix" SHA256SUMS.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            code-office-*.vsix
            SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: code-office-release-${{ github.ref_name }}
          path: |
            code-office-*.vsix
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            code-office-*.vsix SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --notes "Release artifacts are built by GitHub Actions from this tag. Verify downloaded VSIX files with SHA256SUMS.txt."

  publish-registries:
    name: Publish VS Marketplace and Open VSX
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Download packaged release artifacts
        uses: actions/download-artifact@v8
        with:
          name: code-office-release-${{ github.ref_name }}

      - name: Validate registry publish secrets
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Missing VSCE_PAT repository secret for VS Marketplace publish"
            exit 1
          fi
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::Missing OVSX_PAT repository secret for Open VSX publish"
            exit 1
          fi

      - name: Validate downloaded release artifacts
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -s "code-office-${VERSION}.vsix"
          test -s "code-office-${VERSION}-openvsx.vsix"
          test -s SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - name: Publish VS Marketplace
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npx vsce publish --packagePath "code-office-${VERSION}.vsix" --pat "$VSCE_PAT"

      - name: Publish Open VSX
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npx ovsx publish "code-office-${VERSION}-openvsx.vsix"
